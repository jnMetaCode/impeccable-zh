name: Localization CI

on:
  push:
    branches: [main]
    paths:
      - "extensions-cn/**"
      - "locales/**"
      - "skill/**"
      - "scripts/build.js"
      - "scripts/lib/**"
      - "scripts/localization/**"
      - "tests/localization*.mjs"
      - "tests/localization-evals/**"
      - "tests/web.test.mjs"
      - "scripts/web/**"
      - "web/**"
      - "upstream-lock.json"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/localization-ci.yml"
      - ".github/workflows/upstream-sync-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "extensions-cn/**"
      - "locales/**"
      - "skill/**"
      - "scripts/build.js"
      - "scripts/lib/**"
      - "scripts/localization/**"
      - "tests/localization*.mjs"
      - "tests/localization-evals/**"
      - "tests/web.test.mjs"
      - "scripts/web/**"
      - "web/**"
      - "upstream-lock.json"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/localization-ci.yml"
      - ".github/workflows/upstream-sync-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localization:
    name: localization (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check localization source and coverage
        run: bun run localization:check

      - name: Audit committed source tree against the frozen upstream
        run: node scripts/localization/sync-audit.mjs --target=HEAD

      - name: Run localization tests
        run: bun run localization:test

      - name: Run upstream core tests
        run: bun run test:core

      - name: Build localized provider bundles
        run: bun run localization:build

      - name: Test and build the Chinese web app
        run: bun run web:test && bun run web:build

      - name: Install the pinned Rust toolchain
        if: matrix.node-version == 24
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.node-version == 24

      - name: Build the Impeccable CLI
        if: matrix.node-version == 24
        run: cargo build --locked -p impeccable

      - name: Exercise isolated install and update
        if: matrix.node-version == 24
        run: bun run localization:e2e:install
